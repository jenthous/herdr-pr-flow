id = "jjangsky.pr-flow"
name = "PR Flow"
version = "0.2.0"
min_herdr_version = "0.9.3"
description = "See every PR your agents opened and where each one is, in a side panel."
platforms = ["linux", "macos"]

[[panes]]
id = "board"
title = "PR Flow"
placement = "split"
command = ["node", "bin/board.js"]

[[actions]]
id = "open"
title = "Open PR Flow"
contexts = ["workspace"]
command = ["node", "bin/open.js"]
